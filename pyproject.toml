[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starbench-evaluation-framework"
version = "0.1.0"
description = "A Docker-backed Codex execution and GPT rubric judging framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Stardust AI" }
]
dependencies = [
  "tqdm>=4.66"
]

[project.scripts]
starbench-run = "starbench.runner.run_benchmark:main"
starbench-distill-skill = "starbench.skill_distiller.distill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"starbench.runner" = ["schemas/*.json"]
